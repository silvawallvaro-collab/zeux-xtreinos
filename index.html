<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loja VIP — Compra de Contas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b0f1a, #071023);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      background: #0c1320;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 {
      color: #06b6d4;
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 20px;
      color: #9aa4b2;
    }
    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
    }
    .whatsapp-btn {
      background: #25D366;
      color: #fff;
    }
    .whatsapp-btn:hover {
      opacity: 0.9;
    }
    .plan {
      background: #122039;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #06b6d4;
    }
    .plan h2 {
      margin: 0 0 10px 0;
      color: #10b981;
    }
    .plan p {
      margin: 0;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Compre sua Conta VIP</h1>
    <p>Escolha seu plano e clique no botão abaixo para enviar o pedido diretamente pelo WhatsApp.</p>
    
    <div class="plan">
      <h2>Plano VIP - R$50</h2>
      <p>Acesso completo e premium da conta VIP.</p>
    </div>
    
    <div class="plan">
      <h2>Plano Básico - R$25</h2>
      <p>Acesso limitado, ideal para testar.</p>
    </div>
    
    <button class="whatsapp-btn" onclick="sendWhatsApp()">Comprar via WhatsApp</button>
  </div>

  <script>
    function sendWhatsApp() {
      const message = "Olá, Gostaria de comprar uma conta VIP. Só cliquem quem realmente for comprar!";
      const phone = "5582996651514"; // seu número do WhatsApp
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
